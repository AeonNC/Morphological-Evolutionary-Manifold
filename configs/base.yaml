# Project Base Configuration

# General Settings
project_name: "MEM"
version: "0.1.0"
seed: 42
device: "cuda" # options: cuda, cpu, mps

# Path Management
# All paths are relative to the project root unless specified
data_root: "data/"
output_root: "outputs/"
config_root: "configs/"
checkpoint_dir: "outputs/checkpoints/"

# Global Hyperparameters
img_size: 256
batch_size: 32
num_workers: 4

# Manifest Settings
manifest_path: "data/manifests/master_manifest.parquet"
split_strategy: "patient" # priority: patient -> subject -> slide -> image
train_val_test_split: [0.7, 0.15, 0.15]

# Reproducibility
save_resolved_config: true
log_package_versions: true
save_git_hash: true
