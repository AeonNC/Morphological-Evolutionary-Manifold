# YOLOv11 Detector Configuration
# Baseline config for blood cell localization (WBC, RBC, Platelets)

model_name: "yolo11n.pt" # Use nano for fast baseline
img_size: 640
epochs: 100
batch: -1 # auto-batch
optimizer: "AdamW"
lr0: 0.001
lrf: 0.01
cos_lr: true
warmup_epochs: 3
patience: 20
seed: 42

# Augmentation
augment: true
mosaic: 0.5
mixup: 0.0
close_mosaic: 10

# Evaluation
metrics: ["mAP50", "mAP50-95", "precision", "recall", "f1"]
device: "cuda"
