[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem"
version = "0.1.0"
description = "Morphological Evolutionary Manifold: research-only computational hematology framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MEM Research Project" }]
dependencies = [
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pydantic==2.10.6",
    "pyyaml==6.0.2",
    "typer==0.15.2",
    "rich==13.9.4",
    "tqdm==4.67.1",
    "pillow==11.1.0",
]

[project.optional-dependencies]
stage0 = [
    "pytest==8.3.5",
    "ruff==0.9.10",
]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
    "pre-commit==4.1.0",
]
full = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "timm==1.0.15",
    "transformers==4.49.0",
    "datasets==3.3.2",
    "scipy==1.15.2",
    "scikit-learn==1.6.1",
    "opencv-python==4.11.0.86",
    "albumentations==2.0.5",
    "scikit-image==0.25.2",
    "ultralytics==8.3.78",
    "imagehash==4.3.2",
    "tensorboard==2.19.0",
    "gudhi==3.11.0",
    "umap-learn==0.5.7",
    "hdbscan==0.8.40",
    "networkx==3.4.2",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "plotly==6.0.0",
    "streamlit==1.43.2",
]

[project.scripts]
mem = "mem.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
